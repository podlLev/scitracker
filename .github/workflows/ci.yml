name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql+psycopg://scitracker:scitracker@127.0.0.1:5432/scitracker_test
      TEST_DATABASE_URL: postgresql+psycopg://scitracker:scitracker@127.0.0.1:5432/scitracker_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scitracker
          POSTGRES_PASSWORD: scitracker
          POSTGRES_DB: scitracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scitracker -d scitracker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Architecture boundaries
        run: uv run lint-imports

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migrations match models
        run: uv run alembic check

      - name: Tests
        run: uv run pytest --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-smoke-secret-0123456789-0123456789-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and start the whole stack
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for _ in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: The application works inside the container
        run: |
          docker compose run --rm api scitracker seed --publications 40
          curl -fsS "http://127.0.0.1:8000/api/v1/publications?limit=1" | grep -q '"items"'
          curl -sI http://127.0.0.1:8000/healthz | grep -qi '^x-request-id:'
          test "$(docker compose exec -T api id -u)" != "0"  # not running as root

      - name: Backup and verified restore
        run: |
          bash scripts/backup.sh
          bash scripts/restore-check.sh "$(ls -1t backups/*.dump | head -n 1)"

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
