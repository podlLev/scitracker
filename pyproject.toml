[project]
name = "scitracker"
version = "0.1.0"
description = "Трекер наукових публікацій за темами (arXiv + Crossref)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.7",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scitracker"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/scitracker/storage/migrations"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["sqlalchemy.orm.DeclarativeBase", "pydantic.BaseModel"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM",
    "PT", "RUF", "S", "T20", "PL", "TCH", "PERF",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913", "PLR2004"]
"src/scitracker/storage/seed.py" = ["S311"]
"src/scitracker/api/**" = ["TC001", "TC002", "TC003"]

# ---------- mypy ----------
[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ['^src/scitracker/storage/migrations/']
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------- pytest / coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real external APIs (deselected by default)"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not live",
    "--cov=scitracker",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["scitracker"]
omit = [
    "src/scitracker/storage/migrations/*",
    "src/scitracker/services/ports.py",
    "src/scitracker/collect.py",
    "src/scitracker/main.py",
    "src/scitracker/create_admin.py",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------- import-linter: межі шарів ----------
[tool.importlinter]
root_package = "scitracker"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is the innermost layer"
type = "forbidden"
source_modules = ["scitracker.domain"]
forbidden_modules = [
    "scitracker.services", "scitracker.sources", "scitracker.storage",
    "scitracker.api", "scitracker.security",
    "sqlalchemy", "psycopg", "alembic", "httpx", "defusedxml",
    "fastapi", "starlette", "pydantic", "uvicorn", "argon2", "jwt",
]

[[tool.importlinter.contracts]]
name = "Services depend only on domain"
type = "forbidden"
source_modules = ["scitracker.services"]
forbidden_modules = [
    "scitracker.sources", "scitracker.storage", "scitracker.api", "scitracker.security",
    "sqlalchemy", "psycopg", "alembic", "httpx", "defusedxml",
    "fastapi", "starlette", "pydantic", "uvicorn", "argon2", "jwt",
]

[[tool.importlinter.contracts]]
name = "API reaches the database only through service ports"
type = "forbidden"
source_modules = ["scitracker.api"]
forbidden_modules = ["sqlalchemy", "psycopg", "alembic"]

[[tool.importlinter.contracts]]
name = "Adapters and interfaces do not import each other"
type = "independence"
modules = [
    "scitracker.sources", "scitracker.storage", "scitracker.api", "scitracker.security",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-defusedxml>=0.7.0.20260504",
]
