[project]
name = "scitracker"
version = "0.1.0"
description = "Трекер наукових публікацій за темами (arXiv + Crossref)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scitracker"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM",
    "PT", "RUF", "S", "T20", "PL", "TCH", "PERF",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]   # assert дозволений у тестах

# ---------- mypy ----------
[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------- pytest / coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=scitracker",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["scitracker"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------- import-linter: межі шарів ----------
[tool.importlinter]
root_package = "scitracker"

[[tool.importlinter.contracts]]
name = "Domain is the innermost layer"
type = "forbidden"
source_modules = ["scitracker.domain"]
forbidden_modules = [
    "scitracker.services",
    "scitracker.sources",
    "scitracker.storage",
    "scitracker.api",
]

[[tool.importlinter.contracts]]
name = "Services depend only on domain (adapters implement service protocols)"
type = "forbidden"
source_modules = ["scitracker.services"]
forbidden_modules = [
    "scitracker.sources",
    "scitracker.storage",
    "scitracker.api",
]

[[tool.importlinter.contracts]]
name = "Adapters and interfaces do not import each other"
type = "independence"
modules = [
    "scitracker.sources",
    "scitracker.storage",
    "scitracker.api",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
